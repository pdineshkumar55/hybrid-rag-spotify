# Nginx reverse proxy for the Hybrid RAG app (Streamlit UI on 127.0.0.1:8501).
#
# Install on the VPS:
#   sudo cp deploy/nginx/hybrid-rag.conf /etc/nginx/sites-available/hybrid-rag.conf
#   sudo sed -i 's/rag.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/hybrid-rag.conf
#   sudo ln -s /etc/nginx/sites-available/hybrid-rag.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN        # adds HTTPS + http->https redirect

# Streamlit talks to the browser over a WebSocket, which needs these upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.example.com;

    # Login prompt so strangers can't spend your OpenAI credits.
    # Create the password file with:  sudo htpasswd -c /etc/nginx/.htpasswd <username>
    auth_basic           "Hybrid RAG";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Hide the Nginx version and add basic security headers
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support (required by Streamlit)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers take a few seconds (two LLM calls); keep the socket open
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Health check for uptime monitors, without the password prompt
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501/_stcore/health;
    }
}
